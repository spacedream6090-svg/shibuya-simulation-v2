# 段ごとの import の決まり(pyproject の [tool.importlinter])の元。親の決定(brief_contracts・2026-11-11・仮採用)と
# 計画 docs/reference/package-map-final-2026-11-09.md の §1-2(層)・§6-4(8 つの決まりと 28 本)から。
# 段を渡すと `python tools/pkgmove/cli.py contracts --stage <段> --tree <木>` が節を作る(作り方は contracts.py)。
#
# - old_only_through の段まで: 今の 5 つの決まり([[old]])をそのまま。
# - その後の段: 新しい決まり([[rule]])を、その段の木で「最終の名に在るモジュール」だけで言う(まだ移っていないファイルは
#   新しい決まりの外=親の決定)。古い決まりは、名が無くなったか、名の意味が変わった(ほかの置き場からファイルが入った)名を
#   外して残す(外した名は報告の dropped_old に出す=黙って弱めない)。28 本は、その段の木の今の名に引き直し、両側のモジュールが
#   在る物だけを、当たる決まりの契約の ignore_imports に載せる。
# - 計画 §6-6 の 2 つ(一時の区分を読めるのは runtime と interfaces だけ・runtime の核は中身を読まない)は、返事その 8 §1-6 の
#   7・3 の答えで足した(決まり 9・10)。from_stage の段から入れる(9=interim_bundles の段から・10=delete の段から=段 4 の終わり)。
schema = "shibuya.tools/pkgmove/contracts/1"
source = "docs/reference/package-map-final-2026-11-09.md"
root_package = "shibuya"
old_only_through = "foundation"
#: 段の順(当てた順=tools/pkgmove/table.py の STAGES と同じ)。interim_bundles は答えの後(親の決定 12)。答えの後の 4 段
#: (返事その 8 §1-4・§1-6)は別々の commit: 連絡の器 4 本 → society(society_contact)・interim_bundles・行 224a(foundation_224a)・delete。
stage_order = ["foundation", "world", "economy", "act", "mind", "society", "runtime", "experiments", "validation",
               "society_contact", "interim_bundles", "foundation_224a", "delete"]

#: §1-2 の層(上から。「|」は互いに読まない兄弟)。build は横に置く(ランの側から読まれない)。
layers = [
  "interfaces",
  "validation.static",
  "experiments.drive",
  "runtime",
  "interim_bundles",
  "world.laws",
  "mind | act | society",
  "world.body",
  "world.model | world.things | economy",
  "world.facts | world.ledger | experiments.port",
  "foundation",
]
side = ["build"]

# ---- 新しい決まり(計画 §6-4 の 1〜8)。名は shibuya. を除いた単位(層の語と build)。
[[rule]]
id = 1
type = "layers"
name = "1 層(§1-2 の順。下から上と、`|` の兄弟の間を読まない)"

[[rule]]
id = 2
type = "forbidden"
name = "2 foundation は何も読まない"
source = ["foundation"]
forbidden_all_except = ["foundation"]

[[rule]]
id = 3
type = "forbidden"
name = "3 mind は foundation(と mind)だけを読む"
source = ["mind"]
forbidden_all_except = ["foundation", "mind"]

[[rule]]
id = 4
type = "protected"
name = "4 act の書く関数(`act.apply`・`act.ops`)を読めるのは act・world.laws・interim_bundles・runtime・interfaces だけ"
protected = ["act.apply", "act.ops"]
allowed = ["act", "world.laws", "interim_bundles", "runtime", "interfaces"]

[[rule]]
id = 5
type = "protected"
name = "5 お金と物の書き手(`economy.ops`・`economy.goods`・`economy.ledger`)を読めるのは economy・interfaces だけ"
protected = ["economy.ops", "economy.goods", "economy.ledger"]
allowed = ["economy", "interfaces"]

[[rule]]
id = 6
type = "forbidden"
name = "6 economy は world.facts と foundation だけを読む"
source = ["economy"]
forbidden_all_except = ["world.facts", "foundation", "economy"]

[[rule]]
id = 7
type = "forbidden"
name = "7 society は act・mind・runtime・world.laws・interim_bundles を読まない"
source = ["society"]
forbidden = ["act", "mind", "runtime", "world.laws", "interim_bundles"]

[[rule]]
id = 8
type = "forbidden"
name = "8 ランの側は build を読まない"
source_all_except = ["build"]
forbidden = ["build"]

# ---- 計画 §6-6 の 2 つの決まり(返事その 8 §1-6 の 7=足す・§1-6 の 3=核の範囲は §6-6 の候補のとおり)。from_stage の段から入れる。
# 番号 9・10 はこの元のファイルの中の番号(計画 §6-4 の 1〜8 の続きではない)。名の文は計画 §6-6 の文。
[[rule]]
id = 9
type = "protected"
name = "§6-6 の 1 一時の区分を読めるのは runtime と interfaces だけ"
protected = ["interim_bundles"]
allowed = ["runtime", "interfaces"]
from_stage = "interim_bundles"

# 核の候補(計画 §6-6 の 2・【見立て】)を元の側に、中身の包み(world・mind・act・economy・society・interim_bundles・experiments)を
# 禁じる側に。計画は核から中身を読む辺を直の辺(モジュールの対)で数えたので、直の辺だけを見る(allow_indirect_imports)。
# 〔検収 中-3〕間接の辺は見ない=名に「直の辺だけ」と書く。核の conductor は核の外の assemble・probe・table を、核の day は核の外の
# state_io を読み、その先で中身に届く(conductor → assemble → act.intent・day → state_io → engine.run → mind ほか)。間接も見る形に
# するには核の外の runtime への辺 4 本を例外にすることになる=核の範囲の問い(親がユーザーに上げる)。
[[rule]]
id = 10
type = "forbidden"
name = "§6-6 の 2 runtime の核は中身を読まない(直の辺だけ)"
source_names = ["runtime.clock", "runtime.clocks", "runtime.state", "runtime.inference.tape", "runtime.systems.conductor",
                "runtime.systems.spec", "runtime.systems.boxes", "runtime.systems.day"]
forbidden = ["world.laws", "world.body", "world.model", "world.things", "world.facts", "world.ledger", "mind", "act", "economy",
             "society", "interim_bundles", "experiments.drive", "experiments.port"]
allow_indirect_imports = true
from_stage = "delete"

