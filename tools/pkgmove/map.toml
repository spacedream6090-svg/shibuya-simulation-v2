# 移す段 3 の対応表(道具 tools/pkgmove/cli.py map が全ファイルの表から作る。手で書かない)。
# 道筋は src/shibuya からの相対。kind: move=移す(empty_head=新しい頭を空に・split_from=割る段の 2 つ目以降の割り先)・
# empty=同じ置き場で頭を空に・split=割る(割る段で split.py が当てる。split_to は割り先・names は名ごとの割り先)・
# delete=消す頭・keep=置き場を変えない。
# held がある行は保留(道具は動かさない)。stage は段 4 の小さな段(答えの後に移す行は、その包みと別の段の名)。
schema = "shibuya.tools/pkgmove/map/1"
source = "docs/reference/package-map-final-2026-11-09-files.md"
source_sha256 = "25523d33250a1d79382541b2cd489e5f91bec950a2fd1a126da7d9ffcbf7cd2d"
stages = ["foundation", "world", "economy", "act", "mind", "society", "runtime", "experiments", "validation", "society_contact", "interim_bundles", "foundation_224a", "delete"]
split_order = ["world/assets.py", "agents/state.py", "engine/calendar.py", "engine/tools/registry.py", "engine/tools/record.py", "engine/events/body.py", "llm/__init__.py", "llm/fleet.py", "llm/mock.py", "llm/undefined.py", "engine/llm_bridge.py", "engine/chooser.py", "engine/poi_target.py", "perception/attention.py", "engine/change_detect.py", "engine/arbiter.py", "engine/relations.py", "engine/commit.py", "engine/presence.py", "engine/calendar_shadow.py", "engine/run.py", "cli.py", "engine/resolve.py", "engine/speech/port.py", "perception/renderer.py"]
# split_deferred: 割る行のまま割る段の順から外した行(table.SPLIT_DEFERRED・理由はそこ)。
split_deferred = []
# split_forwarders: 割った後も決まった型の転送で残す元のファイル → main の割り先(table.SPLIT_FORWARDERS)。
# split_entries: 割る行の main と if __name__ == "__main__" の割り先(table.SPLIT_ENTRIES)。道具はどちらも table.py から読む。
