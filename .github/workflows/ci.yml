# CI 二段のうち GPU なし段(実装計画書 §6)。GPU 必須テスト(@pytest.mark.gpu)はセルフホストランナーで別途。
name: ci

on:
  push:
    branches: ["main", "build/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Secret scan (tracked files)
        run: |
          git ls-files -z | xargs -0 python tools/scan_secrets.py
      - name: Layer contracts (import-linter)
        run: lint-imports
      - name: Unit / property tests
        run: pytest -q -m "not gpu and not slow"
      - name: Data not tracked (data/ must stay out of git)
        run: |
          if git ls-files data | grep -q .; then echo "data/ files are tracked"; exit 1; fi
