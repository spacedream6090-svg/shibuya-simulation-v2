# CI の 3 段(第333・3-2-4「取り出したばかりの状態での試験」)。GitHub の ubuntu・data/ は無い。
#   ci-0  push と PR: 静的な検査(秘密スキャン・層の契約・data/ が追跡されていない)
#   ci-1  push と PR: data の要らない単体と結合(not gpu and not slow)を 2 並列で。data の要る試験は
#         requires_data の印で飛び、id ごとの飛ばした数をジョブの要約に出す(合否にしない)
#   ci-2  毎晩(JST 3 時)と手動: slow のうち data の要らないもの。時間の門は記録だけ(SHIBUYA_TIME_GATES=record)
# 本体の夜間(data のある全体の試験・byte-check 19 構成・golden・性能の門)は作者の機械で回す(CI には入れない)。
# GPU 必須の試験(@pytest.mark.gpu)はセルフホストランナーで別に。
name: ci

on:
  push:
    branches: ["main", "build/**"]
  pull_request:
  schedule:
    - cron: "0 18 * * *"  # UTC 18 時 = JST 3 時(既定の枝で回る)
  workflow_dispatch:

jobs:
  ci-0:
    name: ci-0 静的な検査
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # 祝日の fixture(内閣府の CSV・cp932)は中身を md5 で固定する(tests/fixtures/README.md)。秘密スキャンは
      # UTF-8 で読めないファイルを cp932 でも読むので(第333)、fixture も検査の対象に入れる。
      - name: Holiday fixture is the pinned Cabinet Office CSV (md5)
        run: |
          echo "733fabb6b488794a0cd3d94df4b1f24a  tests/fixtures/calendar/syukujitsu.csv" | md5sum -c -
      - name: Secret scan (tracked files)
        run: |
          git ls-files -z | xargs -0 python tools/scan_secrets.py
      - name: Layer contracts (import-linter)
        run: lint-imports
      - name: Data not tracked (data/ must stay out of git)
        run: |
          if git ls-files data | grep -q .; then echo "data/ files are tracked"; exit 1; fi

  ci-1:
    name: ci-1 単体と結合(not gpu and not slow)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 旧 commit の src を git archive で取り出す試験がある(test_state_format_10f の U1)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit / integration tests (2 並列)
        run: pytest -q -m "not gpu and not slow" -n 2 --dist loadfile

  ci-2:
    name: ci-2 夜の slow(data 不要・時間の門は記録だけ)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SHIBUYA_TIME_GATES: record
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Slow tests (2 並列・data 不要の分)
        run: pytest -q -m "slow and not gpu" -n 2 --dist loadfile
