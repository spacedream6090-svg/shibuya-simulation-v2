llm_fleet:
  engine:
    name: "vllm"
    version: "0.28.0"
    torch: "2.8.0+cu128"
    cuda_driver: "570.86"
    attention_backend: "FLASH_ATTN"
  env:
    VLLM_BATCH_INVARIANT: "1"
    VLLM_MARLIN_USE_ATOMIC_ADD: "0"
    VLLM_USE_V1: "1"
  replicas:
    - tier: "T1"
      model: "Qwen/Qwen3-14B"
      revision: "main"
      quant: "int8"
      weights_blake3: "8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e"
      tp: 1
      dp: 1
      gpus: [0]
      max_num_seqs: 64
      max_model_len: 2048
      gpu_memory_utilization: 0.9
      in_flight_cap: 64
  routing:
    rule: "xxhash(call_id) mod n_replicas; least-in-flight on imbalance"
    cell_affinity: false
  decoding:
    T1:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 64
      seed: 20260908
    T2:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 512
      seed: 20260908
  prompt_contract:
    version: "pc-v1"
    static_tok: 750
    cell_tok: 250
    individual_tok: 300
  prefix_caching_hash_algo: "sha256_cbor"
  cache_salt: "smoke"

concurrency:
  scheduler:
    name: "two-phase-commit"
    version: "u9-v1"
  phases:
    - "read_intent"
    - "arbitrate"
    - "commit"
  priority_key: "(ceil_ns(t_notice), blake3(run_salt||tick||resource_id||agent_id))"
  tiebreak_key: "(t_sim_ns, class_rank, blake3(run_salt||t_sim_ns||subject_id), subject_id)"
  class_rank:
    institution: -1
    conversation: 0
    plan_boundary: 1
    individual: 2
    cell: 3
  llm_apply:
    policy: "pending_apply"
    order: "(t_apply, event_class, blake3(run_salt||t_apply||agent_id))"
    overdue: "defer_to_arbiter"
    missing: "agent_waits"
  retry_rounds: 1
  arbiter:
    rule: "4class_fixed_rank+promotion+merge+degrade"
    promotion_T_max_min: 30.0
    degrade_enabled: true

budget:
  source:
    path: "docs/design/v2-budget-declaration.md"
    commit: "0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f60718293"
    blake3: "2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b"
  effective:
    W1: 24
    L4: 4000000
    L6: 64
    M8: 24
    M11: 1300
    P6: 2.0
    P4: "declared-loops-only"

hardware:
  profile: "local-1gpu"
  gpus:
    - "NVIDIA RTX A5000 24GB (CC 8.6)"
  cpu: "x86-64 16C/32T"
  ram_gb: 64.0
  os: "Windows 11 + WSL2 Ubuntu 24.04"

output:
  journal: "runs/{run_id}/journal.parquet"
  checkpoints: "runs/{run_id}/checkpoints/"
  llm_tape: "runs/{run_id}/tape.parquet"
  diagnostics:
    columns:
      - "deferred"
      - "promoted"
      - "degraded"
      - "suppressed"
      - "conservation_transfer_residual"
      - "conservation_stock_residual"
      - "tape_miss"
      - "unresolved"
      - "overdue_applies"

lineage:
  parent_run: null
